[project]
name = "hargaturun"
version = "0.1.0"
description = "HargaTurun deterministic pricing oracle, API, and marketplace backend"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.116.1",
    "pillow==11.3.0",
    "python-multipart==0.0.20",
    "uvicorn[standard]==0.35.0",
]

[project.scripts]
hargaturun-api = "hargaturun.main:run"

[project.optional-dependencies]
dev = [
    "httpx==0.28.1",
    "pytest==8.4.1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["hargaturun*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "unit: Fast deterministic unit tests",
    "integration: Live/in-process service integration tests",
    "real_model: Explicit opt-in tests requiring live local model server",
    "compose: Explicit opt-in tests for Docker/Podman compose stack",
]
