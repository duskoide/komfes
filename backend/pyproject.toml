[project]
name = "hargaturun"
version = "0.1.0"
description = "HargaTurun backend — deterministic pricing oracle + FastAPI recommendation API"
readme = "README.md"
requires-python = ">=3.11"
# The pricing oracle (hargaturun.pricing) is intentionally pure-stdlib so it can
# run in training data generation and in tests without installing anything.
# The API layer adds these once it lands:
dependencies = []

[project.optional-dependencies]
api = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["hargaturun*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
