[project]
name = "hargaturun"
version = "0.1.0"
description = "HargaTurun deterministic pricing oracle, API, and marketplace backend"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.116.1",
    "uvicorn[standard]==0.35.0",
]

[project.scripts]
hargaturun-api = "hargaturun.main:run"

[project.optional-dependencies]
dev = [
    "httpx==0.28.1",
    "pytest==8.4.1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["hargaturun*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
